name = "dragon-radar"
account_id = "79c279fdde0b82a171e0de6fd4c80c43"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
# 部署時保留在 Cloudflare 後台手動加的變數（例如 THREADS_APP_ID），不要被 wrangler deploy 清掉
keep_vars = true

[observability]
enabled = true

# 每 10 分鐘抓 Threads 並更新事件狀態；每週一 03:00 UTC 更新 Threads token
[triggers]
crons = ["*/10 * * * *", "0 3 * * 1"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "dragon-radar"
database_id = "87666f00-bba8-41ba-be54-920fbf40e849"
migrations_dir = "migrations"

[vars]
# 允許的前端來源，逗號分隔。GitHub Pages 的網域加上本機開發
ALLOWED_ORIGINS = "https://current-radar.pages.dev,https://u8906250.github.io,http://localhost:5173"
# "true" 時不打 Threads API，改用內建示範貼文
MOCK_MODE = "false"
THREADS_API_BASE = "https://graph.threads.net/v1.0"
# Nominatim 要求識別用的 User-Agent，請改成可聯絡到你的資訊
NOMINATIM_USER_AGENT = "dragonRadar/0.1 (https://github.com/u8906250/dragonRadar)"
# 主要模型與備用模型（2026-10-17 用真實發放公告比較後選定：日期、縣市、多地點都正確）
AI_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
AI_MODEL_FALLBACK = "@cf/mistralai/mistral-small-3.1-24b-instruct"
DEFAULT_RADIUS_KM = "80"
# 是否開放一般使用者新增關鍵字。等帳號綁定做好再改成 "true"
ALLOW_USER_KEYWORDS = "false"
# Meta 審核 threads_keyword_search 的狀態，通過後改成 "approved"
THREADS_SEARCH_STATUS = "review"

# Secrets（用 wrangler secret put 設定，不要寫在這裡）
#   THREADS_ACCESS_TOKEN  Threads 長效 token
#   ADMIN_TOKEN           /api/admin/* 的 Bearer token，也用在 /auth/threads/start?key=
#   THREADS_APP_ID        Threads App ID
#   THREADS_APP_SECRET    Threads App 密鑰
