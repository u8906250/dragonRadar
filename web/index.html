<!doctype html>
<html lang="zh-Hant-TW" data-theme="current">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ea611d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="洋流雷達" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>洋流雷達</title>
    <meta name="description" content="從 Threads 找出附近正在發放的活動，用雷達顯示相對位置" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-wave" aria-hidden="true">≋</span>
          <span class="brand-text" id="brand-text">洋流雷達</span>
          <span class="brand-wave" aria-hidden="true">≋</span>
          <span id="mode-badge" class="badge" hidden></span>
        </div>
        <div class="controls">
          <button type="button" id="theme-btn" class="chip" title="切換主題">主題</button>
          <button type="button" id="notify-btn" class="chip" title="開啟聲音與通知">通知</button>
        </div>
      </header>

      <main id="stage">
        <section id="radar-view" class="view" aria-label="雷達"></section>
        <section id="map-view" class="view" hidden aria-label="地圖"><div id="map"></div></section>

        <div class="overlay overlay-bl">
          <div class="chips" id="base-chips" role="radiogroup" aria-label="底圖" hidden>
            <button type="button" class="chip" data-base="clear" role="radio" aria-checked="false">清晰</button>
            <button type="button" class="chip" data-base="nlsc" role="radio" aria-checked="false" title="內政部國土測繪中心 台灣通用電子地圖">台灣電子地圖</button>
            <button type="button" class="chip" data-base="osm" role="radio" aria-checked="false">OSM</button>
          </div>
          <div class="chips" id="scale-chips" role="radiogroup" aria-label="雷達範圍">
            <button type="button" class="chip" data-scale="1" role="radio" aria-checked="false">1 km</button>
            <button type="button" class="chip" data-scale="5" role="radio" aria-checked="false">5 km</button>
            <button type="button" class="chip" data-scale="20" role="radio" aria-checked="false">20 km</button>
            <button type="button" class="chip on" data-scale="region" role="radio" aria-checked="true" title="涵蓋整個台北市與新北市">雙北</button>
            <button type="button" class="chip" data-scale="taiwan" role="radio" aria-checked="false" title="涵蓋全台灣與離島">全台</button>
          </div>
        </div>
        <div class="overlay overlay-tr">
          <button type="button" id="locate-btn" class="chip" title="重新定位到我的位置">定位</button>
          <button type="button" id="compass-btn" class="chip" hidden title="雷達跟著手機方向轉">指北針</button>
          <button type="button" id="pick-origin" class="chip" hidden>設定位置</button>
          <button type="button" id="view-btn" class="chip primary">地圖</button>
        </div>
      </main>

      <aside id="panel" class="panel">
        <button type="button" class="panel-handle" id="panel-toggle" aria-label="展開或收合清單"><span></span></button>
        <div class="panel-head">
          <strong id="count-label">載入中…</strong>
          <span id="origin-label" class="muted">定位中…</span>
          <button type="button" id="use-gps" class="link-btn" hidden>改用 GPS</button>
          <span id="updated-label" class="muted right"></span>
        </div>
        <button type="button" id="kw-btn" class="kw-row" aria-label="管理追蹤的關鍵字">
          <span class="kw-label">追蹤</span>
          <span id="kw-summary" class="kw-tags"></span>
          <span class="kw-edit">編輯</span>
        </button>
        <ul id="event-list" class="event-list"></ul>
        <p id="empty-hint" class="muted hint" hidden></p>
      </aside>

      <div id="banner" class="banner" hidden></div>
      <div id="detail" class="sheet" hidden></div>
      <div id="kw-sheet" class="sheet" hidden>
        <div class="sheet-head">
          <strong id="kw-title">追蹤關鍵字</strong>
          <button type="button" class="chip" data-act="close" aria-label="關閉">關閉</button>
        </div>
        <p class="muted sheet-note" id="kw-intro">點一下切換追蹤。雷達只顯示你追蹤的關鍵字找到的發放。</p>
        <div id="kw-list" class="kw-list" role="group" aria-label="關鍵字"></div>
        <form id="kw-form" class="kw-form" autocomplete="off">
          <input id="kw-input" type="text" inputmode="text" enterkeyhint="done" maxlength="20" placeholder="輸入新關鍵字，例如 免費發放" aria-label="新關鍵字" />
          <button type="submit" class="btn primary" id="kw-add">加入</button>
        </form>
        <p id="kw-msg" class="muted sheet-note" aria-live="polite"></p>
        <div id="kw-rules" class="kw-rules"></div>
        <p class="muted sheet-note small" id="kw-share-note">關鍵字由所有人共用，同時最多搜尋 <span id="kw-max">10</span> 個。新增的關鍵字 7 天沒人追蹤會自動停止搜尋。</p>
      </div>
      <div id="theme-sheet" class="sheet" hidden>
        <div class="sheet-head">
          <strong>選擇主題</strong>
          <button type="button" class="chip" data-act="close" aria-label="關閉">關閉</button>
        </div>
        <ul id="theme-list" class="theme-list"></ul>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
