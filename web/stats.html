<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>統計｜洋流雷達</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="legal.css" />
  <link rel="stylesheet" href="stats.css" />
  <style>
    main { max-width: 860px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn { font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); background: #fff; border: 2px solid var(--ink); border-radius: 999px; box-shadow: 2px 2px 0 var(--ink); padding: 6px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; min-height: 36px; }
    .btn.primary { background: #ffe08a; }
    .btn[aria-pressed='true'] { background: var(--ink); color: var(--cream); }
    input[type='password'] { font: inherit; font-size: 16px; flex: 1 1 200px; min-width: 0; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; }
    .msg { font-size: 14px; color: var(--muted); margin: 8px 0 0; }
    .msg.err { color: #b3261e; font-weight: 700; }
    #stats { transition: opacity 0.2s; }
    #stats.loading { opacity: 0.45; }
    .hide-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <nav><a href="./">← 回雷達</a><a href="admin.html">回報管理</a></nav>
  <article>
    <h1>統計</h1>
    <p class="meta">大家回報的貼文、放上雷達的活動，只算數字（不記是誰回報的）。資料只留 30 天。只有拿管理 token 的人看得到。</p>

    <section id="login" hidden>
      <form id="login-form" class="row" autocomplete="off">
        <input id="token" type="password" placeholder="管理 token（ADMIN_TOKEN）" aria-label="管理 token" />
        <button type="submit" class="btn primary">登入</button>
      </form>
      <p class="msg">token 只存在這個瀏覽器裡，跟回報管理頁共用。</p>
      <p id="login-msg" class="msg err" aria-live="polite"></p>
    </section>

    <section id="panel" hidden>
      <div class="row" role="group" aria-label="範圍">
        <button type="button" class="btn" data-days="7" aria-pressed="false">7 天</button>
        <button type="button" class="btn" data-days="14" aria-pressed="false">14 天</button>
        <button type="button" class="btn" data-days="30" aria-pressed="true">30 天</button>
        <button type="button" class="btn" id="reload">重新整理</button>
      </div>
      <p id="msg" class="msg err" aria-live="polite"></p>
      <div id="stats"></div>
    </section>
  </article>
</main>
<div class="tip" id="tip" hidden></div>
<script type="module" src="./src/stats-page.ts"></script>
</body>
</html>
