<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>回報管理｜洋流雷達</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="legal.css" />
  <style>
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .btn { font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); background: #fff; border: 2px solid var(--ink); border-radius: 999px; box-shadow: 2px 2px 0 var(--ink); padding: 6px 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; min-height: 36px; }
    .btn.primary { background: #ffe08a; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    input[type='password'] { font: inherit; font-size: 16px; flex: 1 1 200px; min-width: 0; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; }
    .msg { font-size: 14px; color: #5d5850; margin: 8px 0 0; }
    .msg.err { color: #b3261e; font-weight: 700; }
    .tabs { display: flex; gap: 8px; margin: 20px 0 12px; }
    .tabs .btn[aria-selected='true'] { background: var(--ink); color: var(--cream); }
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .fb { background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 12px 14px; }
    .fb-head { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: #5d5850; }
    .tag { display: inline-block; padding: 0 8px; border-radius: 999px; background: var(--orange); color: #fff; font-weight: 700; font-size: 13px; }
    .fb b { display: block; margin: 6px 0 2px; font-size: 16px; overflow-wrap: anywhere; }
    .fb .muted { color: #5d5850; font-size: 13px; overflow-wrap: anywhere; }
    .fb .note { margin: 8px 0; padding: 6px 10px; background: #fff8ec; border-left: 4px solid var(--orange); font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .fb .note.none { color: #5d5850; font-style: italic; }
    .fb .row { margin-top: 10px; }
    .empty { color: #5d5850; text-align: center; padding: 24px 0; }
    .apply { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #b9b2a6; }
    .apply textarea { width: 100%; font: inherit; font-size: 16px; padding: 8px 10px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; resize: vertical; }
    .apply .hint { font-size: 12px; color: #5d5850; margin: 4px 0 8px; }
    .apply .title-input { flex: 1 1 160px; min-width: 0; font: inherit; font-size: 16px; padding: 6px 10px; border: 2px solid var(--ink); border-radius: 10px; background: #fff; }
    .result { margin: 0 0 12px; padding: 10px 12px; background: #e9f6ee; border: 2px solid #2f7d4f; border-radius: 12px; font-size: 14px; }
    .result.err { background: #fdecea; border-color: #b3261e; }
    .result ul { margin: 6px 0 0; padding-left: 20px; }
    .pin-map { height: 280px; margin-top: 8px; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; position: relative; z-index: 0; }
    .pin-msg { font-size: 13px; margin: 6px 0 0; color: #2f7d4f; overflow-wrap: anywhere; }
    .pin-msg.err { color: #b3261e; font-weight: 700; }
    .pin-msg:empty { display: none; }
    .pin-marker span { display: block; width: 18px; height: 18px; margin: 2px 0 0 5px; border-radius: 50% 50% 50% 0; background: #dc2626; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45); transform: rotate(-45deg); box-sizing: border-box; }
    .pin-mark-label { font-size: 12px; font-weight: 700; padding: 0 6px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <nav><a href="./">← 回雷達</a></nav>
  <article>
    <h1>回報管理</h1>
    <p class="meta">大家在詳細資料按「回報問題」送來的地點錯誤、時間錯誤等。只有拿管理 token 的人看得到。</p>

    <section id="login" hidden>
      <form id="login-form" class="row" autocomplete="off">
        <input id="token" type="password" placeholder="管理 token（ADMIN_TOKEN）" aria-label="管理 token" />
        <button type="submit" class="btn primary">登入</button>
      </form>
      <p class="msg">token 只存在這支手機的瀏覽器裡。</p>
      <p id="login-msg" class="msg err" aria-live="polite"></p>
    </section>

    <section id="panel" hidden>
      <div class="row">
        <button type="button" class="btn primary" id="push-btn">開啟回報通知</button>
        <button type="button" class="btn" id="logout">登出</button>
      </div>
      <p id="push-msg" class="msg" aria-live="polite"></p>
      <div class="tabs" role="tablist">
        <button type="button" class="btn" role="tab" data-status="open" aria-selected="true">未處理</button>
        <button type="button" class="btn" role="tab" data-status="resolved" aria-selected="false">已處理</button>
      </div>
      <div id="result" class="result" hidden aria-live="polite"></div>
      <ul id="list" class="list" aria-live="polite"></ul>
      <p id="list-msg" class="msg err" aria-live="polite"></p>
    </section>
  </article>
</main>
<script type="module">
  import { pinPicker } from './src/map';

  (() => {
    const PROD_API = 'https://dragon-radar.happybadminton.workers.dev';
    const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    // 不接受網址參數指定 API：不然有人做一個連結就能把 token 送到別的網站
    const API = local ? 'http://localhost:8787' : PROD_API;
    const LS_TOKEN = 'dr.adminToken';
    const LS_PUSH = 'dr.adminPush';
    const $ = (s) => document.querySelector(s);
    const ls = {
      get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
      set: (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* 無痕模式 */ } },
    };
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const fmt = new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
    const when = (t) => (t ? fmt.format(new Date(t * 1000)) : '');
    const EVENT_STATUS = { upcoming: '還沒開始', active: '進行中', ended: '已結束', unlocated: '找不到地點' };
    let status = 'open';
    // 改車掃一站的地點用的小地圖：每筆回報一張（按了才開），標的位置、查詢結果另外記，
    // 列表重畫（切到別的分頁再回來會重新載入）後照樣放回去；還沒送出的欄位也一樣
    let rowsById = new Map();
    const pickers = new Map();
    const pins = new Map();
    const pinMsgs = new Map();
    const drafts = new Map();
    const DRAFT_FIELDS = '#list [data-place], #list [data-title], #list [data-note]';
    const draftKey = (el) => ['place', 'title', 'note'].filter((k) => el.dataset[k] !== undefined).map((k) => `${k}:${el.dataset[k]}`)[0];
    const TAIPEI = { lat: 25.0478, lng: 121.517 };

    async function api(path, opts = {}) {
      const r = await fetch(API + path, {
        ...opts,
        headers: { authorization: `Bearer ${ls.get(LS_TOKEN) || ''}`, ...(opts.body ? { 'content-type': 'application/json' } : {}) },
      });
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) throw Object.assign(new Error('token 不對'), { auth: true });
      if (!r.ok) throw new Error(j.error || `錯誤 ${r.status}`);
      return j;
    }

    function show(loggedIn) {
      $('#login').hidden = loggedIn;
      $('#panel').hidden = !loggedIn;
    }

    async function load() {
      $('#list-msg').textContent = '';
      try {
        const { feedback } = await api(`/api/admin/feedback?status=${status}`);
        render(feedback);
        if (status === 'open') document.title = feedback.length ? `(${feedback.length}) 回報管理｜洋流雷達` : '回報管理｜洋流雷達';
      } catch (e) {
        if (e.auth) {
          ls.set(LS_TOKEN, null);
          show(false);
          $('#login-msg').textContent = 'token 不對或已經換了，請重新登入';
          return;
        }
        $('#list-msg').textContent = e.message;
      }
    }

    function render(rows) {
      const list = $('#list');
      for (const el of document.querySelectorAll(DRAFT_FIELDS)) {
        if (el.value !== el.defaultValue) drafts.set(draftKey(el), el.value);
        else drafts.delete(draftKey(el));
      }
      const wasOpen = [...pickers.keys()];
      for (const p of pickers.values()) void p.then((x) => x.remove());
      pickers.clear();
      rowsById = new Map(rows.map((f) => [String(f.id), f]));
      if (!rows.length) {
        list.innerHTML = `<li class="empty">${status === 'open' ? '沒有未處理的回報' : '還沒有已處理的回報'}</li>`;
        return;
      }
      list.innerHTML = rows
        .map((f) => {
          const evState = f.event_status ? EVENT_STATUS[f.event_status] || f.event_status : f.current_event_id ? `已重新判讀，現在是 #${f.current_event_id}` : '已刪除';
          const live = f.event_status === 'upcoming' || f.event_status === 'active';
          // 重新判讀過、原本那一則換掉了：連到同一則貼文現在的那一則
          const showId = live ? f.event_id : f.current_event_id;
          // 車掃指定了哪一站：回報可能掛在同一則貼文的別站上（那一站不在雷達上時），不比對標題
          const renamed = !f.stop && f.event_title && f.event_title !== f.title ? `（現在的標題：${esc(f.event_title)}）` : '';
          const stopLine = f.stop ? `<div class="muted">車掃的站：${esc(f.stop)}${f.stop_at ? `（預計 ${when(f.stop_at)} 經過）` : ''}</div>` : '';
          const links = [
            showId ? `<a class="btn" href="./?event=${showId}">雷達上看</a>` : '',
            /^https:\/\//.test(f.permalink || '') ? `<a class="btn" href="${esc(f.permalink)}" target="_blank" rel="noopener">原文</a>` : '',
            f.lat != null ? `<a class="btn" href="https://www.google.com/maps/search/?api=1&query=${f.lat},${f.lng}" target="_blank" rel="noopener">Google 地圖</a>` : '',
            f.status === 'open'
              ? `<button type="button" class="btn" data-id="${f.id}" data-to="resolved">已處理</button>`
              : `<button type="button" class="btn" data-id="${f.id}" data-to="open">改回未處理</button>`,
          ].join('');
          // 套用：說明當成補充、重新判讀；不是發放活動、重複的直接下架
          const canReprocess = f.source !== 'official' && f.source !== 'news';
          const prefill = f.note ? (f.kind === 'location' ? `地點：${f.note}` : f.kind === 'time' ? `時間：${f.note}` : f.note) : '';
          const takedownScope = f.kind === 'not_event' ? 'post' : 'event';
          const curTitle = f.event_title || f.title;
          const apply =
            f.status === 'open'
              ? `<div class="apply">
              ${
                f.stop
                  ? `<div class="row"><input type="text" class="title-input" data-place="${f.id}" maxlength="120" value="${esc(f.kind === 'location' ? f.note || '' : '')}" placeholder="地址、店名，或座標 25.0478, 121.5170" aria-label="這一站的地點" /><button type="button" class="btn" data-find="${f.id}">查地點</button><button type="button" class="btn" data-map="${f.id}">在地圖上標</button></div>
              <div class="pin-map" id="pin-map-${f.id}" hidden></div>
              <p class="pin-msg" id="pin-msg-${f.id}" aria-live="polite"></p>
              <div class="row"><button type="button" class="btn${f.kind === 'location' ? ' primary' : ''}" data-apply="stop_place" data-id="${f.id}">修改這一站的地點</button></div>
              <p class="hint">只改這一站：寫地址、店名按「查地點」標到地圖上，不對再拖紅色標記或點地圖；也可以按「在地圖上標」直接點（灰點是這一站現在的位置）。標了位置就用標的，上面寫的當成地點名稱（空白就保留原本的）；沒標就照寫的查（查到約略位置不算），或貼 Google 地圖按右鍵複製的座標。雷達上的點、時間表、路線跟著改，其他站不動。</p>`
                  : ''
              }
              <div class="row"><input type="text" class="title-input" data-title="${f.id}" maxlength="30" value="${esc(curTitle)}" aria-label="新標題" /><button type="button" class="btn primary" data-apply="title" data-id="${f.id}">改標題</button></div>
              <p class="hint">改標題：直接改這個地點的標題（固定據點的每天時段一起改），不經過 AI，之後重新判讀也會保留。</p>
              ${canReprocess ? `<textarea rows="2" maxlength="200" data-note="${f.id}" placeholder="要補充給 AI 的內容，例如：地點是○○路12號、時間是 15:00 開始">${esc(prefill)}</textarea>` : ''}
              <div class="row">
                ${canReprocess ? `<button type="button" class="btn primary" data-apply="supplement" data-id="${f.id}">套用並重新判讀</button>` : ''}
                ${
                  f.stop
                    ? `<button type="button" class="btn${f.kind === 'remove_stop' ? ' primary' : ''}" data-apply="remove_stop" data-id="${f.id}">刪除這一站</button>`
                    : `<button type="button" class="btn" data-apply="takedown" data-scope="${takedownScope}" data-id="${f.id}">${takedownScope === 'post' ? '整則從雷達下架' : '從雷達下架'}</button>`
                }
              </div>
              <p class="hint">${canReprocess ? '套用：把上面的內容加到這則貼文的補充，用現在的規則重新判讀（之前手動改過的會被蓋掉）。' : '官方行程、新聞不能重新判讀。'}${f.stop ? '刪除這一站：從車掃的時間表、路線、雷達拿掉這一站，其他站照舊。' : ''}套用或下架後自動標成已處理。</p>
            </div>`
              : '';
          return `<li class="fb">
            <div class="fb-head"><span class="tag">${esc(f.kind_label)}</span><span>${when(f.created_at)} 回報${f.resolved_at ? `・${when(f.resolved_at)} 處理` : ''}</span></div>
            <b>${esc(f.title)}${renamed}</b>
            ${stopLine}
            <div class="muted">地點：${esc(f.stop ? f.place_text || '' : f.event_place || f.place_text || '')}${!f.stop && f.approx_area ? `（約略位置：${esc(f.approx_area)}）` : ''}</div>
            <div class="muted">事件：#${f.event_id}・${esc(evState)}${f.start_at ? `・${when(f.start_at)} 開始` : ''}${f.username ? `・@${esc(f.username)}` : ''}</div>
            ${f.supplement ? `<div class="muted">補充：${esc(f.supplement)}</div>` : ''}
            <p class="note${f.note ? '' : ' none'}">${f.note ? esc(f.note) : '沒寫說明'}</p>
            <div class="row">${links}</div>
            ${apply}
          </li>`;
        })
        .join('');
      for (const el of document.querySelectorAll(DRAFT_FIELDS)) {
        const v = drafts.get(draftKey(el));
        if (v !== undefined) el.value = v;
      }
      // 不在這次列表、或已經處理的：地圖上標的位置不用留
      for (const id of [...pins.keys(), ...pinMsgs.keys()]) {
        if (rowsById.get(id)?.status === 'open') continue;
        pins.delete(id);
        pinMsgs.delete(id);
      }
      for (const [id, m] of pinMsgs) pinMsg(id, m.text, m.err);
      for (const id of new Set([...wasOpen, ...pins.keys()])) if (rowsById.get(id)?.status === 'open') void openMap(id);
    }

    function pinMsg(id, text, err = false) {
      pinMsgs.set(id, { text, err });
      const el = document.getElementById(`pin-msg-${id}`);
      if (!el) return;
      el.textContent = text;
      el.classList.toggle('err', err);
    }

    /** 打開這筆回報的小地圖：從標過的位置、這一站現在的位置（灰點）或回報的那一則開始 */
    function openMap(id) {
      if (pickers.has(id)) return pickers.get(id);
      const el = document.getElementById(`pin-map-${id}`);
      const f = rowsById.get(id);
      if (!el || !f) return Promise.resolve(null);
      el.hidden = false;
      const cur = f.stop_lat != null ? { lat: f.stop_lat, lng: f.stop_lng } : null;
      const pin = pins.get(id) ?? null;
      const center = pin ?? cur ?? (f.lat != null ? { lat: f.lat, lng: f.lng } : TAIPEI);
      const p = pinPicker(
        el,
        pin,
        center,
        'nlsc',
        (ll) => {
          pins.set(id, ll);
          pinMsg(id, `標在 ${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}，按「修改這一站的地點」套用。`);
        },
        cur ? { at: cur, title: '現在的位置' } : undefined,
      ).catch((e) => {
        pickers.delete(id);
        pinMsg(id, `地圖載入失敗：${e.message}`, true);
        return null;
      });
      pickers.set(id, p);
      return p;
    }

    /** 照欄位寫的查位置，查到的標在小地圖上 */
    async function findPlace(id, btn) {
      const place = document.querySelector(`input[data-place="${id}"]`)?.value.trim() ?? '';
      if (!place) {
        pinMsg(id, '請先寫地址、店名或座標。', true);
        return;
      }
      btn.disabled = true;
      btn.textContent = '查詢中…';
      try {
        const r = await api('/api/admin/locate', { method: 'POST', body: JSON.stringify({ place }) });
        const picker = await openMap(id);
        if (!picker) return;
        if (!r.found) {
          pinMsg(id, '查不到這個地點，請寫完整地址或店名，或直接在地圖上點。', true);
        } else if (r.approxArea) {
          // 約略位置不標：只移過去，讓管理者自己點
          pins.delete(id);
          picker.set(null);
          picker.view({ lat: r.lat, lng: r.lng }, 15);
          pinMsg(id, `只查到約略位置（${r.approxArea}），請在地圖上點出正確位置。`, true);
        } else {
          const p = { lat: r.lat, lng: r.lng };
          pins.set(id, p);
          picker.set(p, 17);
          pinMsg(id, `查到${r.name ? `：${r.name}` : ''}。位置不對可以拖紅色標記或點地圖，再按「修改這一站的地點」。`);
        }
      } catch (e) {
        pinMsg(id, e.message, true);
      } finally {
        btn.disabled = false;
        btn.textContent = '查地點';
      }
    }

    /** 套用成功：這筆回報標的位置、沒送出的欄位不用留 */
    function forget(id) {
      pins.delete(id);
      pinMsgs.delete(id);
      for (const k of ['place', 'title', 'note']) drafts.delete(`${k}:${id}`);
    }

    const evLine = (ev) => {
      const where = ev.lat == null ? '（找不到地點，不會出現在雷達上）' : ev.approx_area ? `（約略位置：${esc(ev.approx_area)}）` : '';
      return `<li>${esc(ev.title)}｜${when(ev.start_at)}${ev.spot ? ' 起，固定據點' : ev.end_open ? ' 開始' : `–${fmt.format(new Date(ev.end_at * 1000)).split(' ').pop()}`}｜${esc(ev.place_text)}${where}</li>`;
    };

    function showResult(html, err = false) {
      const el = $('#result');
      el.innerHTML = html;
      el.classList.toggle('err', err);
      el.hidden = false;
    }

    $('#list').addEventListener('click', async (e) => {
      const find = e.target.closest('button[data-find]');
      if (find) {
        void findPlace(find.dataset.find, find);
        return;
      }
      const mapBtn = e.target.closest('button[data-map]');
      if (mapBtn) {
        const id = mapBtn.dataset.map;
        void openMap(id).then((p) => {
          if (p && !pins.has(id)) pinMsg(id, rowsById.get(id)?.stop_lat != null ? '點地圖標出這一站的正確位置（灰點是現在的位置）。' : '這一站現在沒有確切位置，點地圖標出來。');
        });
        return;
      }
      const a = e.target.closest('button[data-apply]');
      if (a) {
        const id = a.dataset.id;
        const action = a.dataset.apply;
        const body = { action };
        if (action === 'title') {
          body.title = document.querySelector(`input[data-title="${id}"]`)?.value.trim() ?? '';
          if (!body.title) {
            showResult('請先寫新的標題。', true);
            return;
          }
        } else if (action === 'supplement') {
          body.note = document.querySelector(`textarea[data-note="${id}"]`)?.value.trim() ?? '';
          if (!body.note) {
            showResult('請先寫要補充的內容。', true);
            return;
          }
        } else if (action === 'stop_place') {
          body.place = document.querySelector(`input[data-place="${id}"]`)?.value.trim() ?? '';
          const pin = pins.get(id);
          if (!body.place && !pin) {
            showResult('請先寫這一站的地點，或在地圖上標位置。', true);
            return;
          }
          if (pin) {
            body.lat = pin.lat;
            body.lng = pin.lng;
            // 欄位預先帶的是回報的說明，不一定是地名：先確認會寫成什麼
            if (!confirm(`這一站改到地圖上標的位置，地點名稱${body.place ? `寫成「${body.place}」` : '不變'}？`)) return;
          }
        } else if (action === 'remove_stop') {
          if (!confirm('確定刪除這一站？車掃的時間表、路線、雷達上的點都會拿掉這一站。')) return;
        } else {
          body.scope = a.dataset.scope;
          if (!confirm(body.scope === 'post' ? '確定把這則貼文的發放、活動都從雷達下架？' : '確定把這一則從雷達下架？')) return;
        }
        for (const x of a.closest('.apply').querySelectorAll('button, textarea, input')) x.disabled = true;
        a.textContent = action === 'supplement' ? '重新判讀中…' : action === 'title' || action === 'stop_place' ? '修改中…' : action === 'remove_stop' ? '刪除中…' : '下架中…';
        try {
          const r = await api(`/api/admin/feedback/${id}/apply`, { method: 'POST', body: JSON.stringify(body) });
          forget(id);
          const list = (r.events || []).map(evLine).join('');
          const lost = r.lostPlaces?.length ? `<br><b>注意：重新判讀後少了這些地點：${r.lostPlaces.map(esc).join('、')}。</b>補充只提到一個地點時，AI 常把其他地點漏掉；可以在「已處理」改回未處理，補充寫完整再套用一次。` : '';
          showResult(
            action === 'title'
              ? `已改標題（${r.changed ?? 0} 筆），標成已處理。現在雷達上這則貼文的：<ul>${list}</ul>`
              : action === 'supplement'
                ? `已套用並重新判讀，標成已處理。現在雷達上的：${list ? `<ul>${list}</ul>` : '沒有（這次判讀沒有放上雷達，可以在「已處理」改回未處理再調整）'}${lost}`
                : action === 'stop_place'
                  ? `已修改這一站的地點，標成已處理。現在雷達上這則貼文的：<ul>${list}</ul>`
                  : action === 'remove_stop'
                  ? `已刪除這一站（時間表 ${r.removedStops ?? 0} 站、雷達上 ${r.removed ?? 0} 個點），標成已處理。${list ? `這則貼文還在雷達上的：<ul>${list}</ul>` : ''}`
                  : `已從雷達下架 ${r.removed ?? 0} 筆，標成已處理。${list ? `這則貼文還在雷達上的：<ul>${list}</ul>` : ''}`,
            !!lost,
          );
          await load();
        } catch (err) {
          showResult(esc(err.message), true);
          await load();
        }
        return;
      }
      const b = e.target.closest('button[data-id]');
      if (!b) return;
      b.disabled = true;
      try {
        await api(`/api/admin/feedback/${b.dataset.id}`, { method: 'POST', body: JSON.stringify({ status: b.dataset.to }) });
        await load();
      } catch (err) {
        b.disabled = false;
        $('#list-msg').textContent = err.message;
      }
    });

    // 地點欄位按 Enter 就查
    $('#list').addEventListener('keydown', (e) => {
      const input = e.target.closest('input[data-place]');
      if (!input || e.key !== 'Enter' || e.isComposing) return;
      e.preventDefault();
      const btn = document.querySelector(`button[data-find="${input.dataset.place}"]`);
      if (btn && !btn.disabled) void findPlace(input.dataset.place, btn);
    });

    for (const t of document.querySelectorAll('[role="tab"]')) {
      t.addEventListener('click', () => {
        status = t.dataset.status;
        for (const x of document.querySelectorAll('[role="tab"]')) x.setAttribute('aria-selected', String(x === t));
        void load();
      });
    }

    $('#login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const v = $('#token').value.trim();
      if (!v) return;
      ls.set(LS_TOKEN, v);
      $('#login-msg').textContent = '';
      show(true);
      $('#token').value = '';
      await load();
      void syncPushUi();
    });

    $('#logout').addEventListener('click', async () => {
      if (ls.get(LS_PUSH) === 'on') await stopPush().catch(() => undefined);
      ls.set(LS_TOKEN, null);
      show(false);
    });

    // ---- 回報通知（手機推播） ----
    let reg = null;
    const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - (s.length % 4)) % 4)), (c) => c.charCodeAt(0));
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

    async function registration() {
      if (reg || !('serviceWorker' in navigator)) return reg;
      try {
        reg = await navigator.serviceWorker.register('sw.js');
      } catch {
        reg = null;
      }
      return reg;
    }

    function pushUi(on, msg) {
      $('#push-btn').textContent = on ? '關閉回報通知' : '開啟回報通知';
      $('#push-msg').textContent = msg || (on ? '有新回報時會推到這支手機。' : '');
    }

    async function startPush() {
      const r = await registration();
      if (!r || !('PushManager' in window)) {
        throw new Error(ios && !standalone ? 'iPhone 要先在洋流雷達按「分享 → 加入主畫面」，從主畫面打開，再連點版本字樣 5 下進來這頁開通知' : '這個瀏覽器不支援推播');
      }
      if ((await Notification.requestPermission()) !== 'granted') throw new Error('沒有取得通知權限，請到瀏覽器設定允許洋流雷達的通知');
      const { key } = await (await fetch(`${API}/api/push/key`)).json();
      const want = b64(key);
      let sub = await r.pushManager.getSubscription();
      const cur = sub && sub.options.applicationServerKey ? new Uint8Array(sub.options.applicationServerKey) : null;
      if (sub && cur && (cur.length !== want.length || cur.some((x, i) => x !== want[i]))) {
        await sub.unsubscribe();
        sub = null;
      }
      sub = sub || (await r.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: want }));
      await api('/api/admin/push/subscribe', { method: 'POST', body: JSON.stringify({ subscription: sub.toJSON() }) });
      ls.set(LS_PUSH, 'on');
    }

    async function stopPush() {
      const r = await registration();
      const sub = r ? await r.pushManager.getSubscription() : null;
      if (sub) await api('/api/admin/push/unsubscribe', { method: 'POST', body: JSON.stringify({ endpoint: sub.endpoint }) });
      ls.set(LS_PUSH, 'off');
      // 雷達的附近通知也用同一個訂閱，開著就不取消
      if (sub && ls.get('dr.push') !== 'on') await sub.unsubscribe().catch(() => undefined);
    }

    $('#push-btn').addEventListener('click', async () => {
      const btn = $('#push-btn');
      btn.disabled = true;
      try {
        if (ls.get(LS_PUSH) === 'on') {
          await stopPush();
          pushUi(false, '已關閉回報通知。');
        } else {
          await startPush();
          pushUi(true, '已開啟，馬上會收到一則確認通知。');
        }
      } catch (e) {
        pushUi(ls.get(LS_PUSH) === 'on', e.message);
      }
      btn.disabled = false;
    });

    /** 打開時確認訂閱還在（瀏覽器可能換了訂閱） */
    async function syncPushUi() {
      const on = ls.get(LS_PUSH) === 'on';
      pushUi(on);
      if (on) await startPush().catch((e) => pushUi(true, `回報通知可能失效了：${e.message}`));
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'refresh') void load();
      });
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && ls.get(LS_TOKEN)) void load();
    });

    if (ls.get(LS_TOKEN)) {
      show(true);
      void load();
      void syncPushUi();
    } else {
      show(false);
    }
  })();
</script>
</body>
</html>
