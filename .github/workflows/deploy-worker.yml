name: Deploy worker to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版號是 v1.<提交次數>，要完整歷史才數得對
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and test
        run: npm run typecheck -w worker && npm run test -w worker
      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply dragon-radar --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 漂流瓶的照片放在 R2（v1.594）：沒有就開一個，已經有了也算成功；開不了（帳號還沒啟用 R2、token 沒權限）這一步失敗但不擋部署
      - name: Make sure the R2 bucket for bottle photos exists
        working-directory: worker
        continue-on-error: true
        run: |
          npx wrangler r2 bucket create dragon-radar-bottle-photos 2>&1 | tee r2.log || true
          grep -qiE "created|already exists|already own" r2.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        working-directory: worker
        run: npx wrangler deploy --var "APP_VERSION:v1.$(git rev-list --count HEAD)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
