name: Deploy web to Cloudflare Pages

# 主要網址：https://current-radar.pages.dev（免費，與後端同一個 Cloudflare 帳號）
# 偶爾部署顯示成功、網站卻還是舊版（2026-11-03 v1.419 遇過），或 Deploy 那一步失敗（2026-11-13 v1.710 遇過，建置都過了）：
# 到 Actions 手動重跑這個流程（workflow_dispatch），或再推一次改到這裡的提交
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cf-pages.yml'
  workflow_dispatch:

concurrency:
  group: cf-pages
  cancel-in-progress: true

env:
  PROJECT: current-radar

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 版號是 v1.<提交次數>，要完整歷史才數得對
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build -w web
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}
          VITE_BASE: /
      - name: Create Pages project if missing
        working-directory: worker
        run: npx wrangler pages project create "$PROJECT" --production-branch main || echo "project exists or could not be created"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 在 web 底下跑：web/functions（分享連結 /e/編號 的預覽卡片）跟著網站一起部署。
      # Cloudflare 的 API 偶爾暫時出錯（2026-11-13 v1.710 連兩次失敗，那時 Cloudflare 公告 Workers API 5xx 變多）：失敗隔 30 秒再試，最多三次
      - name: Deploy
        working-directory: web
        run: |
          for i in 1 2 3; do
            npx wrangler pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true && exit 0
            echo "deploy failed ($i/3)"
            [ "$i" -lt 3 ] && sleep 30
          done
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
